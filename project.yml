name: PerfectWhisper

configs:
  Debug: debug
  Release: release

options:
  bundleIdPrefix: com.kt315
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Ad-hoc signing by default so the project builds for anyone.
    # Set your own team and certificates in Xcode or via environment variables.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: "1.1.1"

targets:
  PerfectWhisper:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/ru.lproj
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleName: PerfectWhisper
        CFBundleDisplayName: PerfectWhisper
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        PWUpdateProject: "kt315/perfectwhisper"
        PWUpdateProvider: "github"
        NSMicrophoneUsageDescription: "PerfectWhisper records audio locally to turn your speech into text. Audio never leaves your Mac."
        NSHumanReadableCopyright: "MIT License"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PERFECTWHISPER_LOGGING
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: Resources/PerfectWhisper-Release.entitlements
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kt315.perfectwhisper
        PRODUCT_NAME: PerfectWhisper
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
        COMBINE_HIDPI_IMAGES: YES

  PerfectWhisperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/ASR/TextPostprocessor.swift
      - path: Sources/ASR/ModelCatalog.swift
      - path: Sources/ASR/Models/FileHasher.swift
      - path: Sources/Update/GitLabUpdater.swift
      - path: Sources/Update/GitHubUpdater.swift
      - path: Sources/Support/L10n.swift
      - path: Sources/App/Prefs.swift
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PERFECTWHISPER_LOGGING
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: Resources/PerfectWhisper-Release.entitlements
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kt315.perfectwhisper.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PerfectWhisper:
    build:
      targets:
        PerfectWhisper: all
        PerfectWhisperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PerfectWhisperTests
    archive:
      config: Release
